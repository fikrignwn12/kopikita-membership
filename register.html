<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Member - KopiKita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="logo" href="index.html">KopiKita</a>
    <div class="header-actions">
      <a class="btn btn-ghost btn-small" href="member.html">Profil saya</a>
      <a class="btn btn-ghost btn-small" href="scan.html">Kasir</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <h1>Daftar member</h1>
    <p class="lede">Gratis. Setelah mendaftar, kartu dengan QR code Anda langsung tersedia.</p>

    <form class="form-card" id="form" novalidate>
      <label for="nama">Nama lengkap</label>
      <input id="nama" name="nama" type="text" autocomplete="name" required maxlength="40">

      <label for="hp">Nomor HP</label>
      <input id="hp" name="hp" type="tel" inputmode="numeric" autocomplete="tel" required placeholder="08123456789">

      <label for="email">Email (opsional)</label>
      <input id="email" name="email" type="email" autocomplete="email">

      <label for="lahir">Tanggal lahir (opsional)</label>
      <input id="lahir" name="lahir" type="date">
      <p class="hint">Dipakai untuk bonus ulang tahun.</p>

      <label for="ref">ID member teman (opsional)</label>
      <input id="ref" name="ref" type="text" placeholder="KK-12345" maxlength="10">
      <p class="hint">Teman Anda mendapat 50 poin bonus.</p>

      <p class="error" id="error" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit" id="submit">Daftar dan buat kartu</button>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">&copy; 2026 KopiKita Cafe</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  (function () {
    var form = document.getElementById('form');
    var err = document.getElementById('error');
    var btn = document.getElementById('submit');

    function fail(text) { err.textContent = text; err.hidden = false; }

    if (!KK.configured) fail(KK.errText(new Error('CONFIG')));

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.hidden = true;

      var nama = form.nama.value.trim();
      var hp = KK.digits(form.hp.value);
      if (nama.length < 2) { fail('Isi nama lengkap Anda.'); form.nama.focus(); return; }
      if (hp.length < 9 || hp.length > 15) { fail('Nomor HP harus 9 sampai 15 angka.'); form.hp.focus(); return; }

      btn.disabled = true;
      btn.textContent = 'Membuat kartu...';
      try {
        var r = await KK.register({
          nama: nama, hp: hp, email: form.email.value.trim(),
          lahir: form.lahir.value, ref: form.ref.value
        });
        window.location.href = KK.link({ id: r.id, token: r.token });
      } catch (ex) {
        fail(KK.errText(ex));
        btn.disabled = false;
        btn.textContent = 'Daftar dan buat kartu';
      }
    });
  })();
</script>
</body>
</html>
